# 基础配置
includes:
- headers/data.yaml
- headers/device.yaml
- headers/misc.yaml
- headers/model.yaml
- headers/optimizer.yaml
- classifiers/UnifiedFT.yaml
- backbones/CLIPViT.yaml


data_root: D:/dataset/miniImageNet--ravi/miniImageNet--ravi
image_size: 224
use_memory: false
augment: true
augment_times: 1
augment_times_query: 1
workers: 4

# Fine-tuning模型配置
classifier:
  name: UnifiedFT
  kwargs:
    feat_dim: 512  
    num_class: 100  # miniImageNet有100个训练类别
    method_type: "FT" # 使用APET方法
    use_fd_align: true  # 使用FD-Align特征对齐

    num_prompts: 16  # APE可学习提示嵌入数量

    alpha: 1.0  # 类别损失权重
    beta: 0.5   # 虚假特征损失权重
    spc_n: 60   # SPC孤立森林模板数
    spc_k: 20   # SPC k-means聚类数

    adapter_ratio: 0.5  # Tip-Adapter适配器降维比例

    inner_param:
      inner_optim:
        name: SGD
        kwargs:
          lr: 0.01
          momentum: 0.9
          weight_decay: 0.0005
      inner_train_iter: 100
      inner_batch_size: 4

# Backbone配置
# TODO: 修改CLIP ViT参数
backbone:
  name: CLIPViTB32
  kwargs:
    freeze_backbone: false  # 允许微调backbone
    output_dim: 512        # 保持CLIP原始输出维度

# 训练配置
batch_size: 8
episode_size: 1
epoch: 60
n_gpu: 1
device_ids: 0

# SGD优化器配置
optimizer:
  name: SGD
  kwargs:
    lr: 0.001
    momentum: 0.9
    weight_decay: 0.0005

lr_scheduler:
  name: StepLR
  kwargs:
    step_size: 20
    gamma: 0.5

# Few-shot设置
way_num: 5
shot_num: 16
query_num: 15
train_episode: 60000
test_episode: 600
test_way: 5
test_shot: 16
test_query: 15

# 保存和日志配置
result_root: c:/Users/LJR/Desktop/libfewshot_data_article
save_interval: 50
log_interval: 100
log_level: info
deterministic: true
seed: 0